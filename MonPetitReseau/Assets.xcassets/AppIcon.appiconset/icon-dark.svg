    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE082"/><stop offset="100%" stop-color="#FFB300"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#80DEEA"/><stop offset="100%" stop-color="#00ACC1"/></linearGradient>
    <linearGradient id="d3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A5D6A7"/><stop offset="100%" stop-color="#43A047"/></linearGradient>
